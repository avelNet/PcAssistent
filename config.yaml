# ─── LLM провайдер ────────────────────────────────────────────────────────────
# provider: "ollama"       — локально, без интернета, медленнее на CPU
# provider: "openrouter"   — облако, бесплатные модели, нужен интернет + api_key
llm:
  provider: "ollama"

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b"        # 7b: ~5 GB RAM, ~4-5 мин на CPU i5-12450H
  keep_alive: "10m"
  num_ctx: 8192
  num_predict: 1024
  num_thread: 10              # 7b берём 10 потоков из 12, оставляем 2 для системы
  temperature: 0.3

openrouter:
  api_key: "YOUR_KEY_HERE"   # получи на https://openrouter.ai/keys и добавь в config.local.yaml
  model: "auto"              # авто-выбор: при старте запрашивает список бесплатных моделей
                             # и выбирает лучшую по: семейство (llama>gemma>qwen) + контекст
                             # можно указать конкретную: "meta-llama/llama-3.1-8b-instruct:free"
  temperature: 0.3
  max_tokens: 1024
  timeout_s: 60

collectors:
  git:
    scan_dirs:
      - "~/projects"
      - "~/work"
      - "~/Development"
    max_depth: 3
    max_repos: 30
    debounce_sec: 2

  jetbrains:
    config_dir: "~/.config/JetBrains"

# Авто-фокус по открытому проекту в JetBrains IDE
# При открытии нового проекта автоматически переключает фокус и озвучивает
# накопленные фоновые задачи. Поставь false если хочешь управлять фокусом
# только через --focus вручную.
auto_focus_from_ide: true

  filesystem:
    watch_dirs:
      - "~/projects"
      - "~/Development"
    ignore:
      - ".git"
      - "__pycache__"
      - "node_modules"
      - ".venv"
      - "target"
      - ".idea"
      - "GetCourse"

  process:
    interval_sec: 60

  clipboard:
    interval_sec: 3
    min_length: 20

obsidian:
  enabled: true
  api_key: "7fe2107b9e090577268261969ea9cab80a24bafb415a5f32b94e72c57873737c"
  host: "https://127.0.0.1:27124"

  # Общий vault для задач всех проектов — прямая запись в ФС.
  # Структура: ~/Obsidian/{ProjectName}/Daily/DD.MM.YYYY.md
  # Открой ~/Obsidian/ как отдельный vault в Obsidian чтобы видеть все проекты.
  shared_root: "~/Obsidian"

  root: "/home/pavel/Tap2Go"    # активный Tap2Go vault (для inotify watcher)
  daily_folder: "Daily"         # папка с дневными заметками
  auto_open: true

  # Папки которые НЕ читаем как контекст (служебные)
  skip_folders:
    - ".obsidian"
    - "Templates"
    - "Daily"

  # Заметки <= max_note_size_kb читаем полностью
  # Большие заметки — только первые preview_chars символов
  max_note_size_kb: 10
  preview_chars: 600

  # Заметки изменённые за последние N дней читаем всегда полностью
  # Также используется как сигнал релевантности в smart selection
  recent_days: 3

voice:
  enabled: true
  engine: "silero"              # silero | supertonic | piper | espeak-ng
  silero_speaker: "xenia"       # xenia | baya | aidar | eugene
  silero_sample_rate: 48000
  voice_style: "F1"             # для supertonic: F1 = женский, M1 = мужской
  lang: "ru"
  # piper-specific (используется если engine: "piper")
  model: "ru_RU-irina-medium"
  model_dir: "~/.local/share/piper"
  fallback_engine: "espeak-ng"

trigger:
  morning_hour: 9
  evening_hour: 19
  min_interval_hours: 2
  work_session_min: 30
  idle_trigger_hours: 2

errors:
  static_analysis: true
  runtime_capture: false        # включить когда настроишь wrapper
  spike_threshold: 5
  spike_window_min: 60
  debounce_sec: 30

productivity:
  deep_work_threshold_min: 15
  focus_poll_sec: 30

storage:
  db_path: "~/.local/share/pc-assistant/db.sqlite"
  ttl_days: 7

ui:
  tray_refresh_sec: 30
  enabled: false                # включить когда установишь PyGObject

logging:
  level: "INFO"                 # DEBUG для разработки
  file: "~/.local/share/pc-assistant/assistant.log"
