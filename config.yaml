# ─── LLM провайдер ────────────────────────────────────────────────────────────
# provider: "ollama"       — локально, без интернета, медленнее на CPU
# provider: "openrouter"   — облако, бесплатные модели, нужен интернет + api_key
llm:
  provider: "ollama"

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b"        # 7b: ~5 GB RAM, ~4-5 мин на CPU i5-12450H
  keep_alive: "10m"
  num_ctx: 8192
  num_predict: 1024
  num_thread: 10              # 7b берём 10 потоков из 12, оставляем 2 для системы
  temperature: 0.3

openrouter:
  api_key: "YOUR_KEY_HERE"   # получи на https://openrouter.ai/keys (бесплатно)
  # Бесплатные модели (без лимита запросов, но rate limit ~20 req/min):
  model: "meta-llama/llama-3.1-8b-instruct:free"
  # Другие хорошие бесплатные варианты:
  #   google/gemma-2-9b-it:free          — хорошо следует инструкциям
  #   mistralai/mistral-7b-instruct:free — быстрый, компактный
  #   qwen/qwen-2-7b-instruct:free       — если привык к qwen
  temperature: 0.3
  max_tokens: 1024
  timeout_s: 60              # облако быстрое, 60 сек более чем достаточно

collectors:
  git:
    scan_dirs:
      - "~/projects"
      - "~/work"
      - "~/Development"
    max_depth: 3
    max_repos: 30
    debounce_sec: 2

  jetbrains:
    config_dir: "~/.config/JetBrains"

  filesystem:
    watch_dirs:
      - "~/projects"
      - "~/Development"
    ignore:
      - ".git"
      - "__pycache__"
      - "node_modules"
      - ".venv"
      - "target"
      - ".idea"

  process:
    interval_sec: 60

  clipboard:
    interval_sec: 3
    min_length: 20

obsidian:
  enabled: false                # включить когда установишь плагин Local REST API
  api_key: "YOUR_KEY_HERE"
  root: "/home/pavel/Obsidian"  # корень — все проекты внутри найдутся сами
  daily_folder: "Daily"         # папка с дневными заметками внутри каждого vault
  auto_open: true
  host: "https://127.0.0.1:27124"

  # Папки которые НЕ читаем как контекст (служебные)
  skip_folders:
    - ".obsidian"
    - "Templates"
    - "Daily"

  # Заметки <= max_note_size_kb читаем полностью
  # Большие заметки — только первые preview_chars символов
  max_note_size_kb: 10
  preview_chars: 600

  # Заметки изменённые за последние N дней читаем всегда полностью
  # Также используется как сигнал релевантности в smart selection
  recent_days: 3

voice:
  enabled: false                # включить когда установишь piper-tts
  engine: "piper"
  model: "ru_RU-ruslan-medium"
  model_dir: "~/.local/share/piper"
  fallback_engine: "espeak-ng"

trigger:
  morning_hour: 9
  evening_hour: 19
  min_interval_hours: 2
  work_session_min: 30
  idle_trigger_hours: 2

errors:
  static_analysis: true
  runtime_capture: false        # включить когда настроишь wrapper
  spike_threshold: 5
  spike_window_min: 60
  debounce_sec: 30

productivity:
  deep_work_threshold_min: 15
  focus_poll_sec: 30

storage:
  db_path: "~/.local/share/pc-assistant/db.sqlite"
  ttl_days: 7

ui:
  tray_refresh_sec: 30
  enabled: false                # включить когда установишь PyGObject

logging:
  level: "INFO"                 # DEBUG для разработки
  file: "~/.local/share/pc-assistant/assistant.log"
